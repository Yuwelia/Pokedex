<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 40px; background-color: #f5dce0; }
        h1 { text-shadow: 2px 2px 0px #00008b, -2px -2px 0px #00008b; color: #fdda0d;}
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            background-color: #ffffff;
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header.xhtml :: header}"></div>

<h1>Trainer List</h1>

<table>
    <thead>
    <tr>
        <th>Nr.</th>
        <th>Titel</th>
        <th>Name</th>
        <th>Region</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="trainer : ${trainerList}">
        <td th:text="${trainer.id}" />
        <td th:text="${trainer.title}" />
        <td> <a th:href="@{/trainer/{id}(id=${trainer.id})}" th:text="${trainer.name}" /> </td>
        <td th:text="${trainer.region}" />
    </tr>
    </tbody>
</table>
</body>
</html>
