<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 40px; background-color: #f5dce0; }
        h1 { text-shadow: 2px 2px 0px #00008b, -2px -2px 0px #00008b; color: #fdda0d;}
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            background-color: #ffffff;
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header.xhtml :: header}"></div>

<h1> Trainer Detailseite </h1>

<table border="1">
    <tr>
        <td width="300" height="300" align="center">
            <img th:src="@{/trainerImages/{name}.png(name=${trainer.name})}" style="width:200px;height:300px;" />
        </td>
        <td>
            <table style="width: 100%; height: 100%; border-collapse: collapse;">
                <tr>
                    <td>Titel</td>
                    <td th:text="${trainer.title}" />
                </tr>
                <tr>
                    <td>Name</td>
                    <td th:text="${trainer.name}" />
                </tr>
                <tr>
                    <td>Region</td>
                    <td th:text="${trainer.region}" />
                </tr>
            </table>
<!--            <table>-->
<!--                <th>Pokemon Liste</th>-->
<!--                <tr th:each="pokemon : ${pokemonList}">-->
<!--                    <td th:text="${pokemon.id}" />-->
<!--                </tr>-->
<!--            </table>-->
        </td>
    </tr>
</table>
<button>Hinzufügen</button>
<button>Bearbeiten</button>
<button>Löschen</button>
</body>
</html>
