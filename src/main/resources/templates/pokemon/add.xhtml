<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 40px; background-color: #f5dce0; }
        h1 { text-shadow: 2px 2px 0px #00008b, -2px -2px 0px #00008b; color: #fdda0d;}
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            background-color: #ffffff;
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>

<h1>Add Pokemon</h1>

<form th:action="@{/pokemon/add}" th:method="post" th:object="${pokemon}">

    <table border="1">

        <tr>
            <td>Pokedex Nr.</td>
            <td> <input type="number" th:field="*{pokedexNumber}" /> </td>
        </tr>

        <tr>
            <td>Name</td>
            <td> <input type="text" th:field="*{name}" style="width:100%;"/> </td>
        </tr>

        <tr>
            <td>Typ</td>
            <td> <input type="text" th:field="*{types}" style="width:100%;"/> </td>
        </tr>
        <tr>
            <td>Trainer</td>
            <td>
                <select th:field="*{trainer.id}" style="width:100%;">
                    <option th:each="trainer : ${trainerList}"
                            th:value="${trainer.id}"
                            th:text="${trainer.name}">
                    </option>
                </select>
            </td>
        </tr>
    </table>
    <button type="submit">Speichern</button>
</form>
</body>
</html>
