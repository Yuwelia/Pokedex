<html xmlns:th="http://www.thymeleaf.org" lang="de">
    <head>
        <style>
            body { font-family: 'Segoe UI', sans-serif; margin: 40px; background-color: #f5dce0; }
            h1 { text-shadow: 2px 2px 0px #00008b, -2px -2px 0px #00008b; color: #fdda0d;}
            table {
                border-collapse: collapse;
                width: 100%;
            }
            th, td {
                background-color: #ffffff;
                border: 1px solid black;
                padding: 8px;
                text-align: left;
            }
        </style>
    </head>
    <body>

    <div th:replace="~{fragments/header.xhtml :: header}"></div>

    <h1>Pokedex</h1>

    <table>
            <thead>
                <tr>
                    <th>Pokedex Nr..</th>
                    <th>Name</th>
                    <th>Typ</th>
                    <th>Stark gegen</th>
                    <th>Anfällig gegen</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pokemon : ${pokemonList}">
                    <td th:text="${pokemon.pokedexNumber}" />
                    <td> <a th:href="@{/pokemon/{id}(id=${pokemon.id})}" th:text="${pokemon.name}" /> </td>
                    <td th:text="${pokemon.types}" />
                    <td th:text="${pokemon.strongAgainst}" />
                    <td th:text="${pokemon.vulnerableTo}" />
                    <td> <a th:href="@{/pokemon/{id}/delete(id=${pokemon.id})}" th:text="D" /> </td>
                </tr>
            </tbody>
        </table>
    <button> <a th:href="@{/pokemon/add}"> Hinzufügen </a> </button>
    </body>
</html>
