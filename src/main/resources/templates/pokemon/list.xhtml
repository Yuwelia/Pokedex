<html xmlns:th="http://www.thymeleaf.org" lang="de">
    <head>
        <h1>Pokedex</h1>
        <style>
            body { font-family: 'Segoe UI', sans-serif; margin: 40px; background-color: #f5dce0; }
            h1 { text-shadow: 2px 2px 0px #00008b, -2px -2px 0px #00008b; color: #fdda0d;}
            table {
                border-collapse: collapse;
                width: 100%;
            }
            th, td {
                background-color: #ffffff;
                border: 1px solid black;
                padding: 8px;
                text-align: left;
            }
        </style>
    </head>
    <body>
        <table>
            <thead>
                <tr>
                    <th>Nr.</th>
                    <th>Name</th>
                    <th>Typ</th>
                    <th>Stark gegen</th>
                    <th>Anfällig gegen</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pokemon : ${pokemonList}">
                    <td th:text="${pokemon.id}" />
<!--                    <td> <a th:href="@{/pokemon/(${pokemon.id})}" th:text="${pokemon.name}" /> </td>-->
                    <td> <a th:href="@{/pokemon/{id}(id=${pokemon.id})}" th:text="${pokemon.name}" /> </td>
                    <td th:text="${pokemon.types}" />
                    <td th:text="${pokemon.strongAgainst}" />
                    <td th:text="${pokemon.vulnerableTo}" />
<!--                    <td th:text="${pokemon.pokedexNumber}" />-->
<!--                    <td th:text="${pokemon.pokemonName}" />-->
<!--                    <td th:text="${pokemon.types}" />-->
<!--                    <td th:text="${pokemon.strongAgainst}" />-->
<!--                    <td th:text="${pokemon.vulnerableTo}" />-->
                </tr>
            </tbody>
        </table>
    </body>
</html>
